services:
  zentssh:
    image: ghcr.io/zentworks/zentssh:latest
    container_name: zentssh
    ports:
      - "${ZENTSSH_PORT:-8080}:8080"
    environment:
      MASTER_KEY: ${MASTER_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DATA_DIR: /data
      WEB_DIR: /app/web
      LISTEN_ADDR: :8080
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOW_WS_NO_ORIGIN: ${ALLOW_WS_NO_ORIGIN:-false}
      WEB_SESSION_TTL: ${WEB_SESSION_TTL:-24h}
      MAX_WEB_SESSIONS_PER_USER: ${MAX_WEB_SESSIONS_PER_USER:-20}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-10m}
      MAX_PASSWORD_HASH_CONCURRENCY: ${MAX_PASSWORD_HASH_CONCURRENCY:-4}
      SSH_SESSION_RETENTION: ${SSH_SESSION_RETENTION:-30m}
      SESSION_BUFFER_SIZE: ${SESSION_BUFFER_SIZE:-2097152}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-8}
      MAX_TOTAL_SESSIONS: ${MAX_TOTAL_SESSIONS:-64}
      MAX_TRANSFERS_PER_USER: ${MAX_TRANSFERS_PER_USER:-3}
      MAX_TOTAL_TRANSFERS: ${MAX_TOTAL_TRANSFERS:-12}
      MAX_SFTP_OPERATIONS_PER_USER: ${MAX_SFTP_OPERATIONS_PER_USER:-6}
      MAX_TOTAL_SFTP_OPERATIONS: ${MAX_TOTAL_SFTP_OPERATIONS:-48}
      SFTP_STREAM_IDLE_TIMEOUT: ${SFTP_STREAM_IDLE_TIMEOUT:-2m}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-2160h}
    volumes:
      - "${ZENTSSH_DATA_VOLUME:-zentssh_data}:/data"
    restart: unless-stopped

volumes:
  zentssh_data:
